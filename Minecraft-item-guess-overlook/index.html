<script>
"use strict";
(() => {
  const fields=["可再生性","堆叠数量","稀有度","获得方式","用途","库存类别","合成方式","掉落方式","初始版本"];
  const items=JSON.parse(document.getElementById("item-data").textContent);
  const collator=new Intl.Collator("zh-CN",{numeric:true});
  const normalize=value=>value.normalize("NFKC").toLocaleLowerCase("zh-CN").trim();
  const tagSets=Object.fromEntries(fields.map(field=>[field,new Set()]));
  const modes=Object.fromEntries(fields.map(field=>[field,"any"]));
  const vocabulary=Object.fromEntries(fields.map(field=>[field,[...new Set(items.flatMap(item=>item.tags[field]))].sort(collator.compare)]));
  const specialOrder={"可再生性":["是","部分","否"],"稀有度":["普通","不常见","稀有","史诗"]};
  for(const [field,order] of Object.entries(specialOrder)){
    vocabulary[field].sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b))||collator.compare(a,b));
  }
  const nameSearch=document.getElementById("name-search");
  const rows=document.getElementById("item-rows");
  const popover=document.getElementById("filter-popover");
  const tagSearch=document.getElementById("tag-search");
  const options=document.getElementById("tag-options");
  const buttons={};
  let openField=null,visibleItems=items;
  const element=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;};
  const chevron='<svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m4 6 4 4 4-4"/></svg>';
  for(const field of fields){
    const th=element("th");th.scope="col";
    const button=element("button","column-button");button.type="button";
    button.setAttribute("aria-label","筛选："+field);button.setAttribute("aria-haspopup","dialog");button.setAttribute("aria-expanded","false");button.setAttribute("aria-controls","filter-popover");
    const top=element("span","column-top");top.append(element("span","",field));top.insertAdjacentHTML("beforeend",chevron);
    button.append(top,element("span","column-summary","全部标签"));
    button.addEventListener("click",()=>openField===field?closePopover():openPopover(field));
    th.append(button);document.getElementById("table-head").append(th);buttons[field]=button;
  }
  function matches(item,excludedField=null){
    const words=normalize(nameSearch.value).split(/\s+/).filter(Boolean);
    if(!words.every(word=>normalize(item.name).includes(word)))return false;
    return fields.every(field=>{
      if(field===excludedField||tagSets[field].size===0)return true;
      const selected=[...tagSets[field]];
      return modes[field]==="all"?selected.every(tag=>item.tags[field].includes(tag)):selected.some(tag=>item.tags[field].includes(tag));
    });
  }
  function render(){
    visibleItems=items.filter(item=>matches(item));
    const fragment=document.createDocumentFragment();
    for(const item of visibleItems){
      const tr=element("tr");tr.append(element("td","",item.name));
      for(const field of fields){
        const td=element("td"),list=element("div","tag-list");
        for(const tag of item.tags[field])list.append(element("span","tag"+(tagSets[field].has(tag)?" matched":""),tag));
        td.append(list);tr.append(td);
      }
      fragment.append(tr);
    }
    if(!visibleItems.length){
      const tr=element("tr"),td=element("td","empty-cell");td.colSpan=10;
      td.append(element("strong","","没有符合条件的物品"),element("p","","试试减少勾选的标签，或清空所有筛选条件。"));
      const clear=element("button","plain-button","清空筛选");clear.type="button";clear.addEventListener("click",resetAll);td.append(clear);tr.append(td);fragment.append(tr);
    }
    rows.replaceChildren(fragment);
    const result=document.getElementById("result-count");result.replaceChildren(element("strong","",String(visibleItems.length)),document.createTextNode(" / "+items.length+" 个物品"));
    document.getElementById("table-summary").textContent=visibleItems.length===items.length?"显示全部 "+items.length+" 个物品":"已筛选出 "+visibleItems.length+" 个物品";
    document.getElementById("export-results").disabled=!visibleItems.length;
    document.getElementById("reset-all").disabled=!nameSearch.value&&!fields.some(field=>tagSets[field].size);
    for(const field of fields){
      const count=tagSets[field].size;buttons[field].classList.toggle("has-selection",count>0);
      buttons[field].querySelector(".column-summary").textContent=count?"已选 "+count+" 项 · "+(modes[field]==="all"?"全部":"任一"):"全部标签";
    }
    renderChips();
  }
  function renderChips(){
    const host=document.getElementById("active-filters");host.replaceChildren();
    const chip=(text,label,clear)=>{const button=element("button","filter-chip");button.type="button";button.setAttribute("aria-label",label);button.title=text;button.append(element("span","",text),element("b","","×"));button.addEventListener("click",clear);host.append(button);};
    if(nameSearch.value)chip("名称："+nameSearch.value,"清除名称搜索",()=>{nameSearch.value="";render();if(openField)renderOptions();});
    for(const field of fields)if(tagSets[field].size){
      const text=field+"："+[...tagSets[field]].join(modes[field]==="all"?" ＋ ":" / ");
      chip(text,"清除"+field+"筛选",()=>{tagSets[field].clear();modes[field]="any";render();if(openField){syncMode();renderOptions();}});
    }
    host.hidden=!host.childElementCount;
  }
  function renderOptions(){
    if(!openField)return;
    const query=normalize(tagSearch.value),field=openField;
    const counts=new Map(vocabulary[field].map(tag=>[tag,0]));
    for(const item of items.filter(item=>matches(item,field)))for(const tag of new Set(item.tags[field]))counts.set(tag,counts.get(tag)+1);
    const fragment=document.createDocumentFragment();
    for(const tag of vocabulary[field]){
      if(query&&!normalize(tag).includes(query))continue;
      const label=element("label","tag-option"),input=element("input");input.type="checkbox";input.value=tag;input.checked=tagSets[field].has(tag);input.setAttribute("aria-label",tag);
      input.addEventListener("change",()=>{input.checked?tagSets[field].add(tag):tagSets[field].delete(tag);render();updateOptionCounts();});
      label.append(input,element("span","option-label",tag),element("span","option-count",String(counts.get(tag)||0)));fragment.append(label);
    }
    if(!fragment.childElementCount)fragment.append(element("p","tag-no-result","没有找到这个标签"));
    options.replaceChildren(fragment);
    document.getElementById("clear-column").disabled=!tagSets[field].size;
  }
  function updateOptionCounts(){
    document.getElementById("clear-column").disabled=!tagSets[openField].size;
  }
  function syncMode(){for(const radio of document.querySelectorAll('input[name="match-mode"]'))radio.checked=radio.value===modes[openField];}
  function placePopover(){
    if(!openField)return;
    const rect=buttons[openField].getBoundingClientRect(),width=Math.min(330,innerWidth-24);
    const below=innerHeight-rect.bottom-20,above=rect.top-20;
    const useAbove=below<260&&above>below;
    const maxHeight=Math.min(500,Math.max(210,useAbove?above:below),innerHeight-24);
    popover.style.width=width+"px";popover.style.maxHeight=maxHeight+"px";
    popover.style.left=Math.max(12,Math.min(rect.left,innerWidth-width-12))+"px";
    popover.style.top=Math.max(12,useAbove?rect.top-popover.offsetHeight-8:Math.min(rect.bottom+8,innerHeight-popover.offsetHeight-12))+"px";
  }
  function openPopover(field){
    closePopover(false);openField=field;buttons[field].setAttribute("aria-expanded","true");
    document.getElementById("popover-title").textContent="筛选 · "+field;tagSearch.value="";syncMode();renderOptions();popover.hidden=false;placePopover();tagSearch.focus({preventScroll:true});
  }
  function closePopover(returnFocus=true){
    if(!openField)return;
    const trigger=buttons[openField];trigger.setAttribute("aria-expanded","false");popover.hidden=true;openField=null;if(returnFocus)trigger.focus({preventScroll:true});
  }
  function resetAll(){
    nameSearch.value="";for(const field of fields){tagSets[field].clear();modes[field]="any";}closePopover(false);render();document.getElementById("table-scroll").scrollTop=0;
  }
  nameSearch.addEventListener("input",()=>{render();if(openField)renderOptions();});
  tagSearch.addEventListener("input",renderOptions);
  for(const radio of document.querySelectorAll('input[name="match-mode"]'))radio.addEventListener("change",()=>{if(openField&&radio.checked){modes[openField]=radio.value;render();}});
  document.getElementById("select-all-tags").addEventListener("click",()=>{for(const tag of vocabulary[openField])tagSets[openField].add(tag);render();renderOptions();});
  document.getElementById("clear-column").addEventListener("click",()=>{tagSets[openField].clear();modes[openField]="any";syncMode();render();renderOptions();});
  document.getElementById("close-popover").addEventListener("click",()=>closePopover());
  document.getElementById("finish-filter").addEventListener("click",()=>closePopover());
  document.getElementById("reset-all").addEventListener("click",resetAll);
  document.addEventListener("pointerdown",event=>{if(openField&&!popover.contains(event.target)&&!buttons[openField].contains(event.target))closePopover(false);});
  document.addEventListener("keydown",event=>{if(event.key==="Escape"&&openField){event.preventDefault();closePopover();}});
  document.addEventListener("focusin",event=>{if(openField&&!popover.contains(event.target)&&!buttons[openField].contains(event.target))closePopover(false);});
  window.addEventListener("resize",placePopover);
  document.getElementById("table-scroll").addEventListener("scroll",()=>closePopover(false),{passive:true});
  window.addEventListener("scroll",placePopover,{passive:true});
  document.getElementById("export-results").addEventListener("click",()=>{
    const quote=value=>'"'+String(value).replaceAll('"','""')+'"';
    const lines=[["名称",...fields],...visibleItems.map(item=>[item.name,...fields.map(field=>item.tags[field].join("、"))])];
    const csv="\uFEFF"+lines.map(line=>line.map(quote).join(",")).join("\r\n");
    const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    const link=element("a");link.href=url;link.download="Minecraft物品筛选结果-"+visibleItems.length+"项.csv";document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  render();
})();
</script>
</body>
